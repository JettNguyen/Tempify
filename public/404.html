<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tempify</title>
  <script>
    // GitHub Pages returns 404 for any path that isn't index.html.
    // Save the intended path and redirect to the app root - the app
    // reads it back from sessionStorage and restores it via history.replaceState.
    // This handles both deep links and browser refreshes on sub-routes.
    // OAuth redirects go to the site root so they don't hit this file.
    var target = location.pathname + location.search + location.hash
    sessionStorage.setItem('spa-path', target)
    location.replace('/?spa=' + encodeURIComponent(target))
  </script>
</head>
<body></body>
</html>
