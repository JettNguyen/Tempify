<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- No zoom lock here: the website lets people pinch to zoom. The iPhone app
         adds the lock as it starts (src/lib/viewport.js). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tempify" />
    <meta name="description" content="Tempify: A daily music games suite. Five games, new songs every day." />
    <!-- Link previews. The image is a full address because Open Graph wants one and some apps
         skip a relative one. Challenge links get their own title from the link-preview Worker. -->
    <meta property="og:site_name" content="Tempify" />
    <meta property="og:title" content="Tempify" />
    <meta property="og:description" content="Five daily music games, with new songs every day." />
    <meta property="og:url" content="https://tempify.me/" />
    <meta property="og:image" content="https://tempify.me/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tempify, five daily music games" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Tempify</title>
  </head>
  <body>
    <!-- Restore path saved by 404.html for GitHub Pages SPA routing -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search)
        var queryPath = params.get('spa')
        var path = queryPath || sessionStorage.getItem('spa-path')
        if (path) {
          sessionStorage.removeItem('spa-path')
          window.history.replaceState(null, '', path)
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
